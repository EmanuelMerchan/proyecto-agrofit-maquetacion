<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styles-usu.css">
    <title>Agrofit</title>
</head>

<body>
    <!-- Botón volver -->
    <div class="volver-cambiar-clave">
        <a href="perfil_usu.html" class="btn-cambiar-clave">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
    </div>


    <!-- Contenedor Principal de la Rutina -->
    <main class="password-container">
        <section class="password-card">
            <h1 class="password-title">Cambiar Contraseña</h1>
            <p class="password-subtitle">
                Asegura tu cuenta de AgroFit con una nueva contraseña robusta.
            </p>

            <form class="password-form">
                <div class="form-group">
                    <label for="current-password">Contraseña Actual</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="current-password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="new-password">Nueva Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="new-password" placeholder="••••••••" required>
                    </div>
                    <span class="help-text">Mínimo 8 caracteres, al menos una mayúscula y un número.</span>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Nueva Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-ellipsis"></i>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                    </div>
                </div>

                
                <a href="perfil_usu.html" type="submit" class="btn-actualizar">
                    <i class="fa-regular fa-floppy-disk"></i> Actualizar Contraseña
                </a>
                
            </form>

            <div class="password-footer">
                <a href="../Inicio_sesion_agrofit/recuperar1_agrofit.html" class="forgot-link">¿Olvidaste tu contraseña actual?</a>
            </div>
        </section>
    </main>

</body>

</html>
