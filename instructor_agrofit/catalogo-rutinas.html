<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/styles-ins.css">

    <title>Agrofit</title>
</head>

<body>

    <div class="catalogo-container">
        <a href="rutinas_ins.html" class="btn-volver"> <i class="fa-solid fa-arrow-left"></i> </a>
        <!-- Encabezado -->
        <div class="catalogo-header">
            <h2 class="catalogo-title">Catálogo de Rutinas</h2>
        </div>

        <!-- Barra de búsqueda y filtros -->
        <div class="catalogo-controls">
            <input type="text" class="search-input" placeholder="Buscar rutinas...">
            <button class="filter-btn">Dificultad</button>
            <form action="nueva-rutina.html">
                <button class="new-btn">+ Nueva Rutina</button>
            </form>
            
        </div>

        <!-- Tarjetas de rutinas -->
        <div class="rutinas-grid">

            <!-- Trajeta 1 -->
            <div class="rutina-card">
                <div class="rutina-tags">
                    <span class="tag">Fuerza</span>
                    <span class="tag">Avanzado</span>
                </div>
                <h3 class="rutina-title">Powerlift Élite Vol. 1</h3>
                <div class="rutina-details">
                    <span class="detail"> <i class="detail-icon fa-solid fa-dumbbell"></i> 8 Ejercicios</span>
                    <span class="detail"> <i class="detail-icon fa-regular fa-clock"></i> 60 min</span>
                </div>

                <div class="rutina-actions">
                    <form action="detalles-rutinas.html">
                        <button class="btn-detalle">Ver Detalle</button>
                    </form>
                    <a href="editar-rutinas.html" class="btn-edit"> <i class="fa-solid fa-pen-to-square"> </i> </a>
                </div>
            </div>

            <!-- Trajeta 2 -->
            <div class="rutina-card">
                <div class="rutina-tags">
                    <span class="tag">Resistencia</span>
                    <span class="tag">Intermedio</span>
                </div>
                <h3 class="rutina-title">Cardio 360</h3>
                <div class="rutina-details">
                    <span class="detail"><i class=" detail-icon fa-solid fa-dumbbell"></i> 7 Ejercicios</span>
                    <span class="detail"><i class=" detail-icon fa-regular fa-clock"></i> 80 min</span>
                </div>

                <div class="rutina-actions">
                    <button class="btn-detalle">Ver Detalle</button>
                    <button class="btn-edit"> <i class=" fa-solid fa-pen-to-square"> </i></button>
                </div>
            </div>

            <!-- Trajeta 3 -->
            <div class="rutina-card">
                <div class="rutina-tags">
                    <span class="tag">Resistencia</span>
                    <span class="tag">Intermedio</span>
                </div>
                <h3 class="rutina-title">Cardio 360</h3>
                <div class="rutina-details">
                    <span class="detail"><i class=" detail-icon fa-solid fa-dumbbell"></i> 7 Ejercicios</span>
                    <span class="detail"><i class=" detail-icon fa-regular fa-clock"></i> 80 min</span>
                </div>

                <div class="rutina-actions">
                    <button class="btn-detalle">Ver Detalle</button>
                    <button class="btn-edit"> <i class="fa-solid fa-pen-to-square"> </i></button>
                </div>
            </div>
            
            <!-- Trajeta 4 -->
            <div class="rutina-card">
                <div class="rutina-tags">
                    <span class="tag">Resistencia</span>
                    <span class="tag">Intermedio</span>
                </div>
                <h3 class="rutina-title">Cardio 360</h3>
                <div class="rutina-details">
                    <span class="detail"><i class=" detail-icon fa-solid fa-dumbbell"></i> 7 Ejercicios</span>
                    <span class="detail"><i class=" detail-icon fa-regular fa-clock"></i> 80 min</span>
                </div>

                <div class="rutina-actions">
                    <button class="btn-detalle">Ver Detalle</button>
                    <button class="btn-edit"> <i class="fa-solid fa-pen-to-square"> </i></button>
                </div>
            </div>
            

        </div>
    </div>

</body>

</html>
